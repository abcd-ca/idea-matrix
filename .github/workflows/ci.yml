name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # For the build provenance attestation, which GitHub only offers on public repos.
  id-token: write
  attestations: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Build the branch head itself, not GitHub's merge commit, so the
          # fingerprint matches a local build or a preview of the same commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run bundle -w packages/mcp

      - name: Fingerprints
        run: |
          {
            echo "### MCP bundle"
            echo
            echo "\`idea-matrix.mcpb\` sha256 \`$(sha256sum packages/mcp/dist/idea-matrix.mcpb | cut -d' ' -f1)\`"
            echo
            echo "\`dist/cli.js\` inside it sha256 \`$(sha256sum packages/mcp/dist/cli.js | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: build-fingerprint
          path: |
            apps/web/out/build.json
            apps/web/out/build.sha256
            packages/mcp/dist/idea-matrix.mcpb

      - name: Attest the build (public repo only)
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            apps/web/out/build.json
            packages/mcp/dist/idea-matrix.mcpb
