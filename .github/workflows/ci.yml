name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # For the build provenance attestation, which GitHub only offers on public repos.
  id-token: write
  attestations: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Build the branch head itself, not GitHub's merge commit, so the
          # fingerprint matches a local build or a preview of the same commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The browser download is a no-op on a cache hit. Its system libraries
      # come through apt, and an apt source on the runner fails now and then
      # (seen: "Hash Sum mismatch" from Google's own Chrome repository). The
      # runner image already carries those libraries for the Chrome it ships
      # with, so an apt failure is a warning, not a failed run; a library that
      # really is missing shows up in the test step.
      - name: Install Chromium for Playwright
        run: |
          npx -w apps/web playwright install chromium
          npx -w apps/web playwright install-deps chromium ||
            echo "::warning::apt failed while installing Chromium's libraries; relying on the runner's own"
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
      - run: npm run bundle -w packages/mcp

      - name: Fingerprints
        run: |
          {
            echo "### MCP bundle"
            echo
            echo "\`idea-matrix.mcpb\` sha256 \`$(sha256sum packages/mcp/dist/idea-matrix.mcpb | cut -d' ' -f1)\`"
            echo
            echo "\`dist/cli.js\` inside it sha256 \`$(sha256sum packages/mcp/dist/cli.js | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: build-fingerprint
          path: |
            apps/web/out/build.json
            apps/web/out/build.sha256
            packages/mcp/dist/idea-matrix.mcpb

      - name: Attest the build (public repo only)
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            apps/web/out/build.json
            packages/mcp/dist/idea-matrix.mcpb
