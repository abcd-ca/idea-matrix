name: Release

# Pushing a version tag (v0.1.0) builds the web app and the Claude Desktop
# bundle and attaches the bundle, its checksum and the web build fingerprint to
# a GitHub Release, so the releases page the app links to always has a
# downloadable idea-matrix.mcpb and the fingerprint to compare against. The tag
# must match the version in every package.json and in the extension manifest.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # For the build provenance attestation, which GitHub only offers on public repos.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - name: Check that the tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0
          for f in package.json apps/web/package.json packages/core/package.json packages/mcp/package.json packages/mcp/manifest.json; do
            v="$(node -p "require('./$f').version")"
            echo "$f: $v"
            if [ "$v" != "$tag" ]; then status=1; fi
          done
          if [ "$status" != 0 ]; then
            echo "Tag v$tag does not match every version above." >&2
            exit 1
          fi

      - run: npm test
      - run: npm run build
      - run: npm run bundle -w packages/mcp

      - name: Write the release notes
        id: notes
        run: |
          fingerprint="$(node -p "require('./apps/web/out/build.json').fingerprint")"
          mcpb="$(sha256sum packages/mcp/dist/idea-matrix.mcpb | cut -d' ' -f1)"
          cli="$(sha256sum packages/mcp/dist/cli.js | cut -d' ' -f1)"
          cat > notes.md <<EOT
          **Claude Desktop extension:** download \`idea-matrix.mcpb\` below and double-click it. Setup steps are in \`packages/mcp/README.md\`.

          **Checksums for this release**, built from commit \`$GITHUB_SHA\`:

          | What | SHA-256 |
          |---|---|
          | Web app fingerprint (shown in the app under Settings → This build) | \`$fingerprint\` |
          | \`idea-matrix.mcpb\` | \`$mcpb\` |
          | \`dist/cli.js\` inside the bundle | \`$cli\` |

          \`build.json\` and \`build.sha256\` below list every file of the web build with its hash. See "Verify the build" in the README for how to check a running copy.
          EOT
          cp apps/web/out/build.json apps/web/out/build.sha256 .

      - name: Attest the build (public repo only)
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            build.json
            packages/mcp/dist/idea-matrix.mcpb

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            packages/mcp/dist/idea-matrix.mcpb build.json build.sha256 \
            --title "Idea Matrix $GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file notes.md
