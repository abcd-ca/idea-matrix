name: Release

# Every push to main whose version (package.json) has no GitHub Release yet
# gets one: the tag is created, the web app and the Claude Desktop bundle are
# built, and the bundle, its checksum and the web build fingerprint are
# attached. Bump the version with `npm run bump -- minor` on a branch; merging
# it is the release. Nobody pushes tags by hand. Re-runnable: a version that
# already has a release is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # For the build provenance attestation, which GitHub only offers on public repos.
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}

      - name: Is there a version without a release?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          status=0
          for f in package.json apps/web/package.json packages/core/package.json packages/mcp/package.json packages/mcp/manifest.json; do
            v="$(node -p "require('./$f').version")"
            echo "$f: $v"
            if [ "$v" != "$version" ]; then status=1; fi
          done
          if [ "$status" != 0 ]; then
            echo "The version differs between files. Run npm run bump to set it everywhere." >&2
            exit 1
          fi
          node scripts/changelog.mjs section "$version" > /dev/null
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for $tag yet; creating one from $GITHUB_SHA."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.release == 'true' && steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.version.outputs.release == 'true'
        run: npm test
      - if: steps.version.outputs.release == 'true'
        run: npm run build
      - if: steps.version.outputs.release == 'true'
        run: npm run bundle -w packages/mcp

      - name: Write the release notes
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fingerprint="$(node -p "require('./apps/web/out/build.json').fingerprint")"
          mcpb="$(sha256sum packages/mcp/dist/idea-matrix.mcpb | cut -d' ' -f1)"
          cli="$(sha256sum packages/mcp/dist/cli.js | cut -d' ' -f1)"
          node scripts/changelog.mjs section > section.md
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')"
          cat section.md > notes.md
          echo >> notes.md
          if [ -n "$previous" ]; then
            echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...v$(node -p "require('./package.json').version")" >> notes.md
            echo >> notes.md
          fi
          cat >> notes.md <<EOT
          **Claude Desktop extension:** download \`idea-matrix.mcpb\` below and double-click it. Setup steps are in \`packages/mcp/README.md\`.

          **Checksums for this release**, built from commit \`$GITHUB_SHA\`:

          | What | SHA-256 |
          |---|---|
          | Web app fingerprint (shown in the app under Settings → This build) | \`$fingerprint\` |
          | \`idea-matrix.mcpb\` | \`$mcpb\` |
          | \`dist/cli.js\` inside the bundle | \`$cli\` |

          \`build.json\` and \`build.sha256\` below list every file of the web build with its hash. See "Verify the build" in the README for how to check a running copy.
          EOT
          cp apps/web/out/build.json apps/web/out/build.sha256 .

      - name: Attest the build (public repo only)
        if: steps.version.outputs.release == 'true' && github.event.repository.private == false
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build.json
            packages/mcp/dist/idea-matrix.mcpb

      - name: Create the tag and the GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            packages/mcp/dist/idea-matrix.mcpb build.json build.sha256 \
            --target "$GITHUB_SHA" \
            --title "Idea Matrix $TAG" \
            --notes-file notes.md
